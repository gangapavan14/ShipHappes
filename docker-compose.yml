services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shiphappens}
      MYSQL_USER: ${MYSQL_USER:-shiphappens}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-shiphappens}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-only}
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-shiphappens}
      DB_USERNAME: ${MYSQL_USER:-shiphappens}
      DB_PASSWORD: ${MYSQL_PASSWORD:-shiphappens}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      EXTERNAL_API_KEY: ${EXTERNAL_API_KEY:?Set EXTERNAL_API_KEY in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5500}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
