spring:
  application:
    name: shiphappens-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/shiphappens}
    username: ${DB_USERNAME:shiphappens}
    password: ${DB_PASSWORD:shiphappens}
    hikari:
      # TiDB Cloud Starter can recycle public-endpoint connections; five minutes is
      # safely below its documented connection lifetime recommendation.
      max-lifetime: ${DB_MAX_LIFETIME:300000}
      keepalive-time: ${DB_KEEPALIVE_TIME:0}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
app:
  security:
    integration-api-key: ${EXTERNAL_API_KEY:change-me-local-integration-key}
    jwt-secret: ${JWT_SECRET:}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    demo-password: ${DEMO_PASSWORD:}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGINS:http://localhost:5500}
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level requestId=%X{requestId:-n/a} %logger{36} - %msg%n"
