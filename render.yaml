services:
  - type: web
    name: shiphappens-api
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_MAX_LIFETIME
        value: "300000"
      - key: JWT_SECRET
        generateValue: true
      - key: EXTERNAL_API_KEY
        generateValue: true
      - key: DEMO_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        # Set this to your Render static site URL, e.g. https://shiphappens-ui.onrender.com
        sync: false

  - type: web
    name: shiphappens-ui
    runtime: static
    region: singapore
    buildCommand: ""
    staticPublishPath: ./frontend
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
