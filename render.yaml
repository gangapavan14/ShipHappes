services:
  - type: web
    name: shiphappens-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: EXTERNAL_API_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
